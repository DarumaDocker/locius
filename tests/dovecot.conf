# Test IMAP server for tests/mail_generic_e2e.py. Setup (as root):
#   mkdir -p /srv/dove/{run,mail}; cp tests/dovecot.conf /srv/dove/; cp tests/dovecot-oauth2.conf /srv/dove/oauth2.conf
#   echo "tester@example.com:{PLAIN}secretpass123" > /srv/dove/users; chown -R nobody:nogroup /srv/dove/mail
#   dovecot -c /srv/dove/dovecot.conf
protocols = imap
listen = 127.0.0.1
base_dir = /srv/dove/run
state_dir = /srv/dove/run
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login xoauth2 oauthbearer
log_path = /srv/dove/dovecot.log
mail_location = maildir:/srv/dove/mail/%u
mail_uid = nobody
mail_gid = nogroup
first_valid_uid = 0
default_internal_user = nobody
default_login_user = nobody
service imap-login {
  inet_listener imap {
    address = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 0
  }
}
passdb {
  driver = oauth2
  mechanisms = xoauth2 oauthbearer
  args = /srv/dove/oauth2.conf  # = tests/dovecot-oauth2.conf
}
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /srv/dove/users
}
userdb {
  driver = static
  args = uid=nobody gid=nogroup home=/srv/dove/mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}
protocol imap {
  mail_plugins =
}
