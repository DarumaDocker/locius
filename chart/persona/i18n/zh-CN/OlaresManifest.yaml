metadata:
  title: 'OMuse'
  description: '你的私人 AI 智能体'
spec:
  fullDescription: |
    OMuse 是运行在你的 Olares 上的私人 AI 智能体（local-first / 默认私密 / 7×24 在线）。它不只是聊天：会把你的需求拆成多步计划，在邮件、文档、团队聊天和网页之间把事情做完——而且在做任何重要的事之前都会先问你。名字来自拉丁语 genius loci「守护一方的灵」。

    **能做什么**

    - **对话 → 计划 → 执行**：说出你的需求，OMuse 自动规划并逐步执行，每一次工具调用都看得见。
    - **Gmail**：支持多个邮箱的搜索、阅读、草稿、回复与发送；营销邮件一键退订；验证码和重置链接对模型自动屏蔽。
    - **Notion 与 Slack**：查资料、把报告写进 Notion、更新任务表；读取频道和讨论串、发送消息。
    - **浏览器**：独立的 Chromium，受限 API（禁止执行任意 JavaScript），实时画面，登录/验证码可由你接管。
    - **MCP 连接器**：接入任意 MCP（Model Context Protocol）服务器，工具定义锁定，防止被悄悄篡改。
    - **自动化**：场景目标（持续推进直到达成）、事件触发（新邮件 / Slack 新消息 / Notion 变化）、定时任务。
    - **Telegram 遥控**：在手机上布置任务、看进度、一键审批。
    - **记忆与技能**：记住你让它记住的事，并沉淀可复用的技能。

    **安全设计**

    - **Sentinel 哨兵**：独立的权限服务，对每个操作做 ALLOW / DENY / ASK 决策；发送、发布、付款、删除一律等你批准。
    - **凭据保险箱**：应用专用密码和令牌加密保存在 Sentinel 中，Agent 和模型永远看不到。
    - **防提示注入**：邮件、网页和工具结果一律视为不可信内容；一旦发现可疑内容，所有写操作都升级为人工审批。
    - **审计记录**：所有模型调用、工具调用、权限决策和审批都写入只追加的哈希链日志。

    默认使用 Olares 本机提供的模型，也可以换成任何 OpenAI 兼容接口。支持中文与 English 界面。
  upgradeDescription: |
    0.2.28：新增 data_query 数据分析工具：对 CSV、Excel 和日志精确计数、求和、平均、分组、透视、百分位、异常值和趋势
    0.2.27：表单的日期/时间框能识别各种写法；搜索结果不再混入配件和广告；除非要求不再下载图片；测试表单用明显的占位数据
    0.2.26：网上查资料更快：OMuse 一步就能完成网页搜索，并能同时读取多个网页（并行读取，不用一页页点开），调研和对比类问题完成得快得多。遇到 Cookie 同意弹窗时会直接拒绝非必要 Cookie，不再来问你；同一个文件不会重复发送；即使附上了文件，回答里也会写出关键结论。
    0.2.25：除非你要文件，否则直接在对话里回答：只有在你要 PDF、Word 或 Excel 文件时（或内容长到不适合放在消息里），OMuse 才会生成文件，简单的请求完成得更快。
    0.2.24：可以生成 Word 文档，处理文件更安全。OMuse 现在能自己生成 Word（.docx）文件，包含标题、列表、表格和图表，不会再把你的内容贴到在线转换网站；任务读过你的文件后，要往网页里输入大段文字会先请你批准。常识类问题回答更快（不再无谓地上网搜索），浏览器实时画面也不会在任务之间来回跳。
    0.2.23：会画图、能直接查行情，回答更快。OMuse 可以自己画图（走势图、柱状图、饼图、甘特图、流程图），直接显示在对话里或放进 PDF；不用打开网页就能查股票、指数、汇率、黄金和加密货币的价格与历史走势，以及公司的估值和财报（市盈率、市值、股息率、营收、毛利率）；还有精确的计算器，用来算贷款月供、利息和 AA 分摊。两个任务不再互相等待：模型请求可以并行，每个任务用自己的浏览器页面——接管只会暂停那一个任务，实时画面也不会在任务之间来回跳。每个任务有用时上限（设置里可改，默认 20 分钟），到时用已有信息作答。一次归档超过 5 封邮件现在需要你批准。
    0.2.22：遇到打不开的网站更聪明了。同一个网站在一个任务里失败或被拦截 3 次后，本任务里不再访问它，OMuse 会换别的来源，而不是反复重试同一个链接；同一步里重复的调用只执行一次；重新规划时会被告知哪些来源要避开；如果提醒过、也重新规划过还是在原地打转，就停止重试，用已有的信息作答，并说明哪些数据没拿到。
    0.2.21：对话里可以收发照片、视频和文件了。发送按钮旁新增「＋」，也可以把文件拖进来或直接粘贴截图：支持图片、视频、PDF、Word、Excel、PowerPoint、Markdown 和文本。OMuse 会把文件和你的文字放在一起分析（视频抽取关键画面；有语音转文字模型时也会听里面的讲话），同一个对话里之后还能再打开查看。OMuse 现在能把网页上的照片和视频保存下来，直接在对话里以图片墙的形式发给你；视频和音频可以直接播放，Telegram 对话里也会以照片和视频的形式收到。
