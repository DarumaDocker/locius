  appid: persona
  title: 'OMuse'
  description: 'Your private AI agent'
  icon: https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/omuse-icon.png
  version: '0.1.0'
  categories:
    - agents
  tags:
    - personal-assistant
    - automation
    - browser
    - agent
    - muse

entrances:
  - name: persona
    host: persona
    port: 8080
    title: 'OMuse'
    icon: https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/omuse-icon.png
    authLevel: private
