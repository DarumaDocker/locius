spec:
  versionName: '0.1.0'
  runAsUser: true
  featuredImage: https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/featured.webp
  promoteImage:
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-1-chat.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-2-approval.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-3-goals.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-4-connections.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-5-audit.webp
    - https://raw.githubusercontent.com/Drlucaslu/locius/main/deploy/market/assets/promote-6-mobile.webp
  fullDescription: |
    OMuse is a private AI agent that lives on your Olares — local-first, private by default and always on. It doesn't just chat: it plans multi-step tasks and carries them out across your email, documents, team chat and the web, and it asks before doing anything that matters.

    **What it does**

    - **Chat → plan → act** – describe what you need; OMuse makes a plan and works through it step by step, showing every tool call.
    - **Gmail** – search, read, draft, reply and send across several mailboxes; one-click unsubscribe from newsletters. Sign-in codes and reset links are hidden from the model.
    - **Notion & Slack** – look things up, write reports into Notion, update task boards, read channels and threads, post messages.
    - **Web browser** – its own Chromium with a restricted API (no arbitrary JavaScript), live view, and human takeover for logins and CAPTCHAs.
    - **MCP connectors** – plug in any MCP server; tool definitions are pinned so a server can't quietly change them.
    - **Automations** – goals it keeps pushing for days until they're achieved, event triggers (new email, Slack message, Notion change) and schedules.
    - **Telegram remote control** – give tasks, follow progress and approve actions with one tap from your phone.
    - **Memory & skills** – remembers what you ask it to remember, and learns reusable skills.

    **Safe by design**

    - **Sentinel** – an independent guard service decides ALLOW / DENY / ASK for every action. Sending, posting, paying and deleting always wait for your approval.
    - **Credentials in a vault** – app passwords and tokens are encrypted in Sentinel; the agent and the model never see them.
    - **Prompt-injection defences** – emails, web pages and tool results are treated as untrusted; suspicious content escalates every write to human approval.
    - **Audit trail** – every model call, tool call, decision and approval goes into an append-only, hash-chained log.

    Runs on the local models served by your Olares by default — any OpenAI-compatible endpoint works. English and 中文 interface.
  upgradeDescription: |
    0.2.30: Translations and texts you ask for in another language stay in that language even when the app is in English
    0.2.29: data_query: derived columns, column-to-column filters, having; invest() for regular saving; optional reply-in-your-language setting; web-call budget
    0.2.28: New data_query tool: exact counts, sums, averages, groups, pivots, percentiles, outliers and trends from CSV, Excel and logs
    0.2.27: Date/time form fields accept free text; search results skip accessories and ads; no image downloads unless asked; test forms use placeholder data
    0.2.26: Faster web research: OMuse searches the web in one step and reads several pages at once (in parallel, without clicking through them), so research and comparison questions finish much sooner. It turns down optional cookies on consent banners without asking you, never sends the same file twice, and always puts the key results in its answer even when it attaches a file.
    0.2.25: Answers stay in the chat unless you ask for a file: OMuse makes a PDF, Word or Excel file only when you ask for one (or the result is too long for a message), so quick requests finish sooner.
    0.2.24: Word documents and safer file handling. OMuse makes Word (.docx) files itself — headings, lists, tables and charts — so it never pastes your content into online converters; once a task has read your files, typing long text into a website asks for your approval first. Quicker answers for general questions (no needless browsing), and the browser live view no longer jumps between tasks.
    0.2.23: Charts, market data and faster replies. OMuse draws charts itself (price trends, bar, pie, Gantt and flow charts) and shows them in the chat or puts them in PDFs; gets stock, index, FX, gold and crypto prices and history, and company valuations and earnings (P/E, market cap, dividend yield, revenue, margins) without opening websites; and has an exact calculator for loans, interest and splits. Two tasks no longer wait for each other: model requests run in parallel, and each task drives its own browser page — a takeover pauses only that task and the live view no longer jumps between tasks. Each task has a time limit (Settings, default 20 minutes) and wraps up with what it has. Archiving more than 5 emails at once now asks for your approval.
  developer: Lucas Lu
  website: https://github.com/Drlucaslu/locius
  sourceCode: https://github.com/Drlucaslu/locius
  doc: https://github.com/Drlucaslu/locius#readme
  submitter: Lucas Lu
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/Drlucaslu/locius/blob/main/LICENSE
  requiredCpu: 500m
  limitedCpu: '7'
  requiredMemory: 1Gi
  limitedMemory: 7Gi
  requiredDisk: 500Mi
  limitedDisk: 30Gi
  supportArch:
    - amd64

permission:
  appData: true
  appCache: true

options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system

envs:
  - envName: OMUSE_MODEL_URL
    required: false
    type: string
    editable: true
    applyOnChange: true
    description: OpenAI-compatible model endpoint (default https://router.<your-olares-name>.olares.com/v1)
  - envName: OMUSE_MODEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: 'Olares/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL'
    description: Default model id (if it isn't served, the first available model is used)
