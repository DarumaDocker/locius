<!doctype html><html><head><meta charset="utf-8"><title>Product</title>
<style>body{font-family:sans-serif} .img{width:300px;height:300px;background:#ff9800} #buy{margin-top:20px}</style></head>
<body><header><a href="/cart" id="cart">0 items in cart</a></header>
<h1 id="t">Case</h1><div class="img"></div><div class="price" id="p">S$21.90</div>
<label>Colour <select id="colour"><option>Aurora Pink</option><option>Aurora Blue</option></select></label>
<div id="buy"><button id="add" aria-label="Add to cart, shift, Alt, K">Add to Cart</button> <button id="now">Buy Now</button></div>
<div id="msg"></div>
<script>
const q = new URLSearchParams(location.search); document.getElementById('t').textContent = (q.get('name') || 'Case') + ' for iPhone 17 Pro Max';
let n = 0; document.getElementById('add').onclick = () => { n++; document.getElementById('cart').textContent = n + ' items in cart';
  document.getElementById('msg').textContent = 'Added to Cart: ' + document.getElementById('t').textContent + ' (' + document.getElementById('colour').value + ')'; };
</script></body></html>
