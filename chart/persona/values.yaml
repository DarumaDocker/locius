# Olares injects userspace / olaresEnv values at install time.
workloads:
  persona:
    replicaCount: 1
userspace:
  appData: /tmp/persona-appdata
  appCache: /tmp/persona-appcache
olaresEnv: {}
image:
  python: docker.io/library/python:3.12-slim
  browser: mcr.microsoft.com/playwright/python:v1.56.0-noble
  busybox: docker.io/beclab/busybox:1.37
timezone: Asia/Singapore
bfl:
  username: ""
