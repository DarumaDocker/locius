<!doctype html><html><head><meta charset="utf-8"><title>Runway-like login</title>
<style>body{margin:0;font:16px sans-serif} #g{position:absolute;left:100px;top:100px;width:240px;height:60px}</style></head>
<body><button id="g" onclick="this.textContent='Signing in...';window.open('popup_login.html','glogin','width=500,height=600')">Continue with Google</button>
<p id="st" style="position:absolute;top:200px;left:100px">Not signed in</p>
<script>window.addEventListener('message',e=>{if(e.data&&e.data.user){document.getElementById('st').textContent='Signed in as '+e.data.user;document.getElementById('g').textContent='Continue with Google';}});</script>
</body></html>
