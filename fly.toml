# OMuse on Fly.io: one machine with one volume.
#   fly launch --no-deploy --copy-config        # once: creates the app (pick your own name and region)
#   fly volumes create omuse_data --size 10     # once: all state lives here
#   fly secrets set OMUSE_PASSWORD=... OMUSE_MODEL_API_KEY=...
#   fly deploy
# Then open https://<app>.fly.dev and sign in as "omuse". Keep it at ONE machine: the state is on the volume.
app = "omuse"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  TZ = "UTC"
  OMUSE_MODEL_URL = "https://api.openai.com/v1"
  OMUSE_MODEL = "gpt-4.1"

[mounts]
  source = "omuse_data"
  destination = "/omuse"

# the web UI (password protected); Fly terminates HTTPS
[http_service]
  internal_port = 8080
  force_https = true
  # always on: schedules, event triggers and the Telegram bot run in the background
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/sentinel/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

# Chromium + three Python services
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4gb"
