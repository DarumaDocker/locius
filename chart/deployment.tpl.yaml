{{- $rt := randAlphaNum 40 }}
{{- $bt := randAlphaNum 40 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: persona-bundle
  namespace: {{ .Release.Namespace }}
data:
  bootstrap.sh: |
__BOOTSTRAP__
__BUNDLE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona
  namespace: {{ .Release.Namespace }}
  labels:
    app: persona
spec:
  replicas: {{ .Values.workloads.persona.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: persona
  template:
    metadata:
      labels:
        app: persona
      annotations:
        persona/bundle: "__HASH__"
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
      - name: init-permissions
        image: "{{ .Values.image.busybox }}"
        command: ["sh", "-c", "for d in /sdata /data /workspace /bprofile /cache; do mkdir -p $d && chown -R 1000:1000 $d; done; chmod 700 /sdata"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - {name: sdata, mountPath: /sdata}
        - {name: rdata, mountPath: /data}
        - {name: workspace, mountPath: /workspace}
        - {name: bprofile, mountPath: /bprofile}
        - {name: cache, mountPath: /cache}
      containers:
      - name: sentinel
        image: "{{ .Values.image.python }}"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/bundle/bootstrap.sh", "sentinel"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        - {name: RUNTIME_TOKEN, value: "{{ $rt }}"}
        - {name: BROWSER_TOKEN, value: "{{ $bt }}"}
        - {name: SENTINEL_DATA, value: /sdata}
        - {name: RUNTIME_URL, value: "http://127.0.0.1:8081"}
        - {name: BROWSER_URL, value: "http://127.0.0.1:8082"}
        - {name: WEB_DIR, value: /tmp/persona/app/web}
        - {name: PATCH_DIR, value: /cache/patch}
        - {name: VOICE_PORT, value: "8083"}
        ports:
        - {containerPort: 8080, name: http, protocol: TCP}
        - {containerPort: 8083, name: voice, protocol: TCP}
        readinessProbe:
          httpGet: {path: /sentinel/api/health, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 60
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: "2", memory: 1Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: bundle, mountPath: /bundle, readOnly: true}
        - {name: sdata, mountPath: /sdata}
        - {name: cache, mountPath: /cache}
      - name: runtime
        image: "{{ .Values.image.python }}"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/bundle/bootstrap.sh", "runtime"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        - {name: RUNTIME_TOKEN, value: "{{ $rt }}"}
        - {name: RUNTIME_DATA, value: /data}
        - {name: APP_ID, value: persona}
        - {name: WORKSPACE, value: /workspace}
        - {name: SENTINEL_URL, value: "http://127.0.0.1:8080"}
        - {name: PERSONA_MODEL_URL, value: {{ (.Values.olaresEnv).OMUSE_MODEL_URL | default (printf "https://router.%s.olares.com/v1" (.Values.bfl).username) | quote }}}
        - {name: PERSONA_MODEL, value: {{ (.Values.olaresEnv).OMUSE_MODEL | default "Olares/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL" | quote }}}
        # optional: an OpenAI-Images-compatible endpoint for make_image (gpt-image-1 / DALL·E / a local FLUX or SD server)
        # and its key — the key is read from the environment only, never shown in Settings or the audit log
        - {name: OMUSE_IMAGE_URL, value: {{ (.Values.olaresEnv).OMUSE_IMAGE_URL | default "" | quote }}}
        - {name: OMUSE_IMAGE_API_KEY, value: {{ (.Values.olaresEnv).OMUSE_IMAGE_API_KEY | default "" | quote }}}
        - {name: OMUSE_IMAGE_MODEL, value: {{ (.Values.olaresEnv).OMUSE_IMAGE_MODEL | default "" | quote }}}
        - {name: PATCH_DIR, value: /cache/patch}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "2", memory: 2Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: bundle, mountPath: /bundle, readOnly: true}
        - {name: rdata, mountPath: /data}
        - {name: workspace, mountPath: /workspace}
        - {name: cache, mountPath: /cache}
      - name: browser
        image: "{{ .Values.image.browser }}"
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/bundle/bootstrap.sh", "browser"]
        env:
        - {name: TZ, value: "{{ .Values.timezone }}"}
        - {name: HOME, value: /tmp}
        - {name: BROWSER_TOKEN, value: "{{ $bt }}"}
        - {name: BROWSER_PROFILE, value: /bprofile}
        - {name: WORKSPACE, value: /workspace}
        - {name: PATCH_DIR, value: /cache/patch}
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "3", memory: 4Gi}
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - {name: bundle, mountPath: /bundle, readOnly: true}
        - {name: bprofile, mountPath: /bprofile}
        - {name: workspace, mountPath: /workspace}
        - {name: cache, mountPath: /cache}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: bundle
        configMap:
          name: persona-bundle
          defaultMode: 365
      - name: sdata
        hostPath:
          path: '{{ .Values.userspace.appCache }}/sentinel'
          type: DirectoryOrCreate
      - name: rdata
        hostPath:
          path: '{{ .Values.userspace.appData }}/runtime'
          type: DirectoryOrCreate
      - name: workspace
        hostPath:
          path: '{{ .Values.userspace.appData }}/workspace'
          type: DirectoryOrCreate
      - name: bprofile
        hostPath:
          path: '{{ .Values.userspace.appCache }}/browser-profile'
          type: DirectoryOrCreate
      - name: cache
        hostPath:
          path: '{{ .Values.userspace.appCache }}/pycache'
          type: DirectoryOrCreate
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: persona
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: persona
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: persona-voice
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: persona
  ports:
  - name: voice
    protocol: TCP
    port: 8083
    targetPort: 8083
